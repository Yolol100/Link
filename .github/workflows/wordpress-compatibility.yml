name: WordPress compatibility

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  runtime:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: WordPress 6.0 / PHP 8.0
            wordpress: '6.0'
            php: '8.0'
            ecosystem: '0'
          - label: WordPress 7.1 / PHP 8.3 / WooCommerce 11.1 / ACF 6.8.9
            wordpress: '7.1'
            php: '8.3'
            ecosystem: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mysqli

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Install verified WP-CLI 2.12.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --output /tmp/wp-cli.phar \
            https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          echo 'ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c  /tmp/wp-cli.phar' | sha256sum --check --strict

      - name: Create clean WordPress runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime=/tmp/ssil-runtime
          plugin_dir="$runtime/wp-content/plugins/super-simple-internal-links"
          rm -rf "$runtime"
          php /tmp/wp-cli.phar core download --path="$runtime" --version='${{ matrix.wordpress }}' --locale=en_US --force
          php /tmp/wp-cli.phar config create --path="$runtime" --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306
          php /tmp/wp-cli.phar config set WP_DEBUG true --raw --path="$runtime"
          php /tmp/wp-cli.phar config set WP_DEBUG_LOG true --raw --path="$runtime"
          php /tmp/wp-cli.phar core install \
            --path="$runtime" \
            --url=http://ssil.test \
            --title='SSIL Runtime' \
            --admin_user=admin \
            --admin_password='runtime-only-password' \
            --admin_email=runtime@example.invalid \
            --skip-email
          if [[ '${{ matrix.ecosystem }}' == '1' ]]; then
            php /tmp/wp-cli.phar plugin install advanced-custom-fields --path="$runtime" --version=6.8.9 --activate
            php /tmp/wp-cli.phar plugin install woocommerce --path="$runtime" --version=11.1.0 --activate
          fi
          mkdir -p "$plugin_dir"
          rsync -a --exclude='.git/' "$GITHUB_WORKSPACE/" "$plugin_dir/"
          rm -f "$runtime/wp-content/debug.log"
          php /tmp/wp-cli.phar plugin activate super-simple-internal-links --path="$runtime"
          php /tmp/wp-cli.phar plugin status super-simple-internal-links --path="$runtime"
          php /tmp/wp-cli.phar eval 'echo function_exists("Webactueel\\SSIL\\auto_link_content_filter") ? "loaded\n" : "missing\n";' --path="$runtime"

      - name: Verify WooCommerce integration hook
        if: matrix.ecosystem == '1'
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval 'if (false === has_filter("woocommerce_short_description", "Webactueel\\SSIL\\auto_link_content_filter")) { fwrite(STDERR, "WooCommerce filter missing\n"); exit(1); } echo "woocommerce-hook-ok\n";' --path=/tmp/ssil-runtime

      - name: Reject runtime PHP errors
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          log=/tmp/ssil-runtime/wp-content/debug.log
          if [[ ! -f "$log" ]]; then
            exit 0
          fi

          # WordPress 7.1 + WooCommerce 11.1 emits one known WooCommerce-owned
          # translation timing notice during WP-CLI plugin activation. Ignore
          # only that exact third-party notice; all other PHP errors still fail.
          filtered=/tmp/ssil-debug-filtered.log
          grep -Ev '_load_textdomain_just_in_time.*woocommerce.*triggered too early' "$log" > "$filtered" || true
          if grep -Eqi 'PHP (Fatal error|Parse error|Warning|Deprecated|Notice)' "$filtered"; then
            cat "$filtered"
            exit 1
          fi
